---
name: Copilot setup steps
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
permissions: {}
jobs:
  # GitHub Copilot coding agent requires this exact job ID.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Set up Python
        # cobo (mise pipx backend) requires Python >=3.14, but the runner's
        # system Python is older — and without uv on PATH mise falls back from
        # uvx to pipx, which ignores the mise-managed Python. Provision both
        # first so `mise install` resolves cobo against the .python-version
        # interpreter (issue #369).
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - name: Install mise tools
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e  # v5.2.3
      - name: Sync dependencies
        run: uv sync
