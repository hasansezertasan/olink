---
name: Docs Link Check
# Runs Sphinx's linkcheck builder over the documentation to catch dead links and
# moved anchors. Link checking hits the network and is inherently flaky
# (transient 5xx, rate limits, CI-blocking sites), so it runs on a weekly
# schedule and on demand — never on pull_request, and it is not part of the
# `check` aggregation gate. A failure here is a maintenance signal, not a merge
# blocker. See https://hasansezertasan.github.io/copier-pyproject/context/docs-stack/#sphinx-lint-and-the-case-conflict-hook-are-always-on-link-checking-is-weekly.
on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 07:00 UTC.
    - cron: "0 7 * * 1"
permissions: {}
jobs:
  linkcheck:
    name: Check documentation links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version
      - name: Setup uv
        id: setup-uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Restore cache
        if: steps.setup-uv.outputs.cache-hit == 'true'
        run: echo "Cache was restored"
      - name: Set reproducible build epoch
        # Pin Sphinx's "today"/copyright to the last commit date so the same
        # commit always renders the same docs output (reproducible-builds.org).
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Check documentation links
        env:
          PYTHONUNBUFFERED: "1"
        run: uv run --no-default-groups --extra all --group docs sphinx-build -b linkcheck docs docs/_build/linkcheck
