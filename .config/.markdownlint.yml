---
default: true
MD013: false  # line-length
# JOURNAL.md is an append-only log with intentionally repeated section
# headings per entry (Context, Decisions, Outcome, ...); siblings_only avoids
# flagging headings that repeat across unrelated entries.
MD024:
  siblings_only: true
# JOURNAL.md uses bold lead-ins (e.g. "**Bugs fixed**") as informal
# sub-groupings within an entry rather than actual headings.
MD036: false
# GitHub issue/PR templates legitimately lack a leading H1 (MD041) or repeat
# one across sections (MD025); disabling globally is harmless since no other
# tracked doc relies on either rule.
MD041: false
MD025: false
# Internal working docs (design spec + implementation plan for this SDD task)
# are committed for reference but need not be lint-clean prose. The actual
# exclusion is done via the markdownlint-cli2 hook's `exclude` regex in
# prek.toml, since prek passes matched files directly as CLI args (bypassing
# cli2's own ignores/globs config-file mechanism).
